<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jadwal Mata Pelajaran</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #d4edda; /* Background warna hijau soft */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 10px 25px rgba(40, 167, 69, 0.15);
            max-width: 450px;
            width: 100%;
            text-align: center;
            border: 2px solid #c3e6cb;
        }

        /* Stiker Tema Sekolah/Pelajaran */
        .sticker-header {
            font-size: 48px;
            margin-bottom: 10px;
            animation: bounce 2s infinite ease-in-out;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        h2 {
            color: #155724;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #1e7e34;
            font-size: 14px;
        }

        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #b1dfbb;
            border-radius: 8px;
            font-size: 15px;
            background-color: #f8f9fa;
            outline: none;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        select:focus {
            border-color: #28a745;
            background-color: #ffffff;
        }

        .schedule-box {
            display: none;
            margin-top: 20px;
            padding: 20px;
            border-radius: 12px;
            background-color: #f1f9f3;
            border: 1px dashed #28a745;
            text-align: left;
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .schedule-header {
            font-weight: bold;
            color: #155724;
            font-size: 16px;
            margin-bottom: 12px;
            border-bottom: 2px solid #c3e6cb;
            padding-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .subject-list {
            list-style: none;
            margin-bottom: 15px;
        }

        .subject-item {
            display: flex;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #e2e8f0;
            color: #2d3748;
            font-size: 14px;
        }

        .subject-item:last-child {
            border-bottom: none;
        }

        .subject-icon {
            margin-right: 10px;
            font-size: 18px;
        }

        .duration-badge {
            background-color: #28a745;
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            text-align: center;
            display: inline-block;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Stiker sesuai topik sekolah & pelajaran -->
        <div class="sticker-header">📚 ✏️ 🗓️</div>
        <h2>Jadwal Mata Pelajaran</h2>

        <!-- Pilihan Hari -->
        <div class="form-group">
            <label for="daySelect">Pilih Hari Belajar:</label>
            <select id="daySelect" onchange="showSchedule()">
                <option value="" disabled selected>-- Pilih Hari --</option>
                <option value="Senin">📅 Senin</option>
                <option value="Selasa">📅 Selasa</option>
                <option value="Rabu">📅 Rabu</option>
                <option value="Kamis">📅 Kamis</option>
                <option value="Jumat">📅 Jumat</option>
                <option value="Sabtu">📅 Sabtu</option>
            </select>
        </div>

        <!-- Tampilan Hasil Jadwal -->
        <div class="schedule-box" id="scheduleBox">
            <div class="schedule-header">
                <span id="selectedDay">Hari</span>
                <span>📖</span>
            </div>
            
            <p style="font-size: 13px; color: #495057; margin-bottom: 8px; font-weight: 600;">Mata Pelajaran:</p>
            <ul class="subject-list" id="subjectList">
                <!-- Daftar mapel dimasukkan via JS -->
            </ul>

            <div class="duration-badge">
                ⏱️ Waktu Belajar: 6 Jam
            </div>
        </div>
    </div>

    <script>
        function showSchedule() {
            const daySelect = document.getElementById('daySelect');
            const scheduleBox = document.getElementById('scheduleBox');
            const selectedDayText = document.getElementById('selectedDay');
            const subjectList = document.getElementById('subjectList');

            const chosenDay = daySelect.value;

            if (!chosenDay) {
                scheduleBox.style.display = 'none';
                return;
            }

            selectedDayText.innerText = 'Hari ' + chosenDay;
            subjectList.innerHTML = '';

            let subjects = [];

            // Jika memilih hari Senin
            if (chosenDay === 'Senin') {
                subjects = [
                    { name: 'Bahasa Jerman', icon: '🇩🇪' },
                    { name: 'Bahasa Inggris', icon: '🇬🇧' },
                    { name: 'Bahasa Indonesia', icon: '🇮🇩' }
                ];
            } else {
                // Untuk hari lainnya (Selasa - Sabtu)
                subjects = [
                    { name: 'Matematika', icon: '📐' },
                    { name: 'Ilmu Pengetahuan Alam (IPA)', icon: '🧪' },
                    { name: 'Pendidikan Pancasila (PPKn)', icon: '🏛️' }
                ];
            }

            // Memasukkan daftar mata pelajaran ke dalam HTML
            subjects.forEach(function(sub) {
                const li = document.createElement('li');
                li.className = 'subject-item';
                li.innerHTML = `<span class="subject-icon">${sub.icon}</span> <span>${sub.name}</span>`;
                subjectList.appendChild(li);
            });

            scheduleBox.style.display = 'block';
        }
    </script>
</body>
  </html>
